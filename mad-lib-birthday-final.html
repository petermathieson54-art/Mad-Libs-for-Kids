<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mad Lib! MhooDeng's Birthday Party 🎂</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;background:#f5f0e8;color:#1a1a1a;padding:8px;max-width:480px;margin:0 auto;}
.screen{display:none;}.screen.active{display:block;}

/* SETUP */
#setup-title{text-align:center;font-size:16px;font-weight:700;color:#1a3a5c;padding:10px 0 5px;}
#setup-sub{text-align:center;font-size:11px;color:#888;margin-bottom:12px;}
#roster-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.r-tile{border:3px solid #d0c8b8;border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;background:#fff;opacity:0.42;transition:all 0.15s;}
.r-tile.sel{border-color:#e0a000;opacity:1;box-shadow:0 0 10px 2px rgba(224,160,0,0.38);}
.r-tile img{width:52px;height:52px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 4px;}
.r-tile .rn{font-size:11px;font-weight:700;color:#3a1a5c;}
.r-tile.sel .rn{color:#b07000;}
#sel-count{text-align:center;font-size:12px;color:#888;margin-bottom:8px;min-height:18px;}
#sel-count span{color:#1a3a5c;font-weight:700;}
.go-btn{width:100%;background:#1a5c2a;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;}
.go-btn:disabled{background:#ccc;cursor:default;}

/* GAME */
#player-row{display:flex;justify-content:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.player-slot{text-align:center;}
.player-ring{border-radius:50%;border:3px solid #d0c8b8;margin:0 auto 2px;overflow:hidden;transition:border-color 0.2s,box-shadow 0.2s;}
.player-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
.player-slot.active .player-ring{border-color:#e0a000;border-width:4px;box-shadow:0 0 12px 3px rgba(224,160,0,0.55);}
.player-name{font-size:10px;font-weight:700;color:#3a1a5c;}
.player-slot.active .player-name{color:#b07000;}

/* CHUNK BOX */
#chunk-box{background:#fff;border:2px solid #d0c8b8;border-radius:9px;padding:9px 10px;margin-bottom:7px;text-align:center;min-height:38px;font-size:13px;font-weight:600;color:#1a3a5c;line-height:1.5;}
#chunk-box.past-col{border-color:#5a8ab8;}
#chunk-box.pres-col{border-color:#5a8a5a;color:#1a5c2a;}
#chunk-box.fut-col{border-color:#b08040;color:#7a4a00;}
#chunk-box .step-lbl{font-size:9px;color:#aaa;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:3px;}

/* BUTTONS — 1 column, full width, each button = one sentence chunk */
#buttons{display:flex;flex-direction:column;gap:6px;margin-bottom:7px;}
.cbtn{background:#e8e0d8;border:2px solid #c8c0b0;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;cursor:default;text-align:left;line-height:1.4;transition:all 0.25s;color:#aaa;display:flex;align-items:flex-start;gap:8px;}
.cbtn.lit{background:#fff;border-color:#c0b8a8;color:#1a1a1a;cursor:pointer;}
.cbtn.lit:hover{background:#e8f0f8;border-color:#5a8ab8;}
.cbtn.chosen{background:#1a5c2a!important;color:#fff!important;border-color:#1a5c2a!important;}
.cbtn .icon{font-size:20px;flex-shrink:0;margin-top:1px;}
.cbtn .txt{flex:1;}
.cbtn .en{display:block;font-size:12px;}
.cbtn .th{font-size:10px;color:#888;display:block;margin-top:2px;}
.cbtn.lit .th{color:#555;}.cbtn.chosen .th{color:#a0e0b0;}

#countdown-wrap{display:none;margin-bottom:6px;}
#countdown-bar{height:5px;border-radius:3px;background:#e0a000;}
#countdown-label{font-size:9px;color:#aaa;text-align:right;margin-top:1px;}
#status{text-align:center;font-size:11px;color:#888;min-height:16px;margin-bottom:5px;}
#status.speaking{color:#1a5c2a;font-weight:700;}#status.waiting{color:#e0a000;font-weight:700;}

#phase-box{display:none;background:#fff;border:2px solid #d0c8b8;border-radius:9px;padding:10px;margin-bottom:7px;text-align:center;}
#phase-instr{font-size:11px;color:#888;margin-bottom:6px;min-height:16px;}
#phase-instr.repeat{color:#1a5c2a;font-weight:700;}#phase-instr.go{color:#1a3a5c;font-weight:700;}
#phase-text{font-size:15px;font-weight:700;color:#1a3a5c;line-height:1.5;}
#phase-text.thai{color:#6a3a8c;font-size:16px;}#phase-text.green{color:#1a5c2a;}
#pcd-wrap{display:none;margin-top:6px;}#pcd-bar{height:5px;border-radius:3px;background:#1a5c2a;}
#pcd-lbl{font-size:9px;color:#aaa;text-align:right;margin-top:1px;}
#done-btn{display:none;margin:8px auto 0;background:#1a5c2a;color:#fff;border:none;border-radius:7px;padding:9px 24px;font-size:13px;font-weight:700;cursor:pointer;}

.btn-row{display:flex;gap:8px;margin-bottom:6px;}
.bigbtn{flex:1;background:#1a3a5c;color:#fff;border:none;border-radius:7px;padding:10px 8px;font-size:13px;font-weight:700;cursor:pointer;}
.bigbtn:hover:not(:disabled){background:#2a5a8c;}.bigbtn:disabled{background:#aaa;cursor:default;}
.bigbtn.stop{background:#c0392b;flex:0 0 auto;padding:10px 12px;}
.voice-note{font-size:9px;color:#ccc;text-align:center;}
/* ── Debug log ── */
#dbg-toggle{position:fixed;bottom:6px;right:6px;background:#222;color:#0f0;border:1px solid #0f0;border-radius:4px;padding:3px 7px;font-size:10px;cursor:pointer;z-index:9999;font-family:monospace;}
#dbg-panel{display:none;position:fixed;bottom:30px;right:0;width:100%;max-width:480px;height:220px;background:#111;color:#0f0;font-family:monospace;font-size:10px;overflow-y:auto;border-top:1px solid #0f0;z-index:9998;padding:4px;}
#dbg-panel .say{color:#7df;}
#dbg-panel .show{color:#fd7;}
#dbg-panel .evt{color:#aaa;}
#dbg-panel .ts{color:#555;margin-right:4px;}

/* CINQ MOTS */
#cinq-screen{background:#1a1a2e;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;color:#fff;}
.cinq-flag{font-size:22px;text-align:center;margin-bottom:3px;}
.cinq-title{font-size:17px;text-align:center;color:#e8c840;margin-bottom:1px;font-style:italic;font-weight:700;}
.cinq-sub{font-size:11px;text-align:center;color:#a0c8f0;margin-bottom:8px;}
.cinq-ring{width:54px;height:54px;border-radius:50%;border:3px solid #e8c840;margin:0 auto 8px;overflow:hidden;box-shadow:0 0 14px 3px rgba(232,200,64,0.4);}
.cinq-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.cinq-pip-row{display:flex;justify-content:center;gap:8px;margin-bottom:8px;}
.cinq-pip{width:26px;height:4px;border-radius:2px;background:#303050;transition:all 0.3s;}
.cinq-pip.done{background:#4060c0;}.cinq-pip.active{background:#e8c840;}
.cinq-card{background:linear-gradient(135deg,#2a1a4e,#1a2a5e);border:2px solid #e8c840;border-radius:12px;padding:12px;margin-bottom:8px;text-align:center;width:100%;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.cinq-num{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#a0c8f0;margin-bottom:6px;}
.cinq-fr{font-size:34px;font-weight:900;color:#e8c840;margin-bottom:4px;}
.cinq-th{font-size:18px;color:#c0a8f0;font-weight:600;margin-bottom:3px;}
.cinq-en{font-size:12px;color:#606070;font-style:italic;}
.cinq-rep-row{display:flex;justify-content:center;gap:10px;margin-bottom:7px;}
.cinq-dot{width:14px;height:14px;border-radius:50%;background:#404060;transition:all 0.2s;}
.cinq-dot.active{background:#e8c840;transform:scale(1.35);}.cinq-dot.done{background:#4060c0;}
#cinq-instr{text-align:center;font-size:12px;color:#a0c8f0;min-height:16px;margin-bottom:6px;}
#cinq-instr.your-turn{color:#e8c840;font-weight:700;}
#cinq-cd-wrap{display:none;margin-bottom:6px;width:100%;}#cinq-cd-bar{height:4px;border-radius:2px;background:#e8c840;}
</style>
</head>
<body>

<div class="screen active" id="screen-setup">
  <div id="setup-title">MhooDeng's Birthday Party 🎂</div>
  <div id="setup-sub">Who's playing? Tap to select.</div>
  <div id="roster-grid"></div>
  <div id="sel-count">Tap to select players</div>
  <button class="go-btn" id="go-btn" onclick="window.startGame()" disabled>▶ Let's play!</button>
  <div class="voice-note" id="voice-note-setup" style="margin-top:8px"></div>
</div>

var doneBtnActive=false, doneCallback=null, currentDrillWord="";

var soundCycle=0;

// ── Voices ───────────────────────────────────────────────────────────────────
var synth=window.speechSynthesis,allVoices=[],enVoices=[],thVoice=null,frVoice=null;
function loadVoices(){
  allVoices=synth.getVoices();if(!allVoices.length)return;
  var prefs=["Liam","Mark","Daniel","Karen","Samantha"];enVoices=[];
  prefs.forEach(function(n){var v=allVoices.find(function(v){return v.name.indexOf(n)>-1&&v.lang.startsWith("en");});if(v&&!enVoices.find(function(e){return e.name===v.name;}))enVoices.push(v);});
  allVoices.forEach(function(v){if(v.lang.startsWith("en")&&!enVoices.find(function(e){return e.name===v.name;}))enVoices.push(v);});
  thVoice=allVoices.find(function(v){return v.lang==="th-TH";})||allVoices.find(function(v){return v.lang.startsWith("th");})||null;
  var fp=["Thomas","Google français","Amelie"];frVoice=null;
  fp.forEach(function(n){if(!frVoice)frVoice=allVoices.find(function(v){return v.name.indexOf(n)>-1&&v.lang.startsWith("fr");});});
  if(!frVoice)frVoice=allVoices.find(function(v){return v.lang==="fr-FR";})||null;
  var v=enVoices[0];
  var note=(v?"🎙 "+v.name:"No EN")+(thVoice?" · TH:"+thVoice.name:"")+(frVoice?" · FR:"+frVoice.name:"");
  ["voice-note","voice-note-setup"].forEach(function(id){var e=document.getElementById(id);if(e)e.textContent=note;});
}
synth.onvoiceschanged=loadVoices;loadVoices();
function enVoice(){return enVoices[0]||null;}

// ── Sounds ───────────────────────────────────────────────────────────────────
var AudioContext=window.AudioContext||window.webkitAudioContext,actx=null;
function getCtx(){if(!actx)actx=new AudioContext();return actx;}
var sfx={
  partyHorn:function(){var c=getCtx(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="sawtooth";o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(900,t+0.15);o.frequency.exponentialRampToValueAtTime(600,t+0.4);g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);o.start(t);o.stop(t+0.5);},
  boing:function(){var c=getCtx(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="sine";o.frequency.setValueAtTime(80,t);o.frequency.exponentialRampToValueAtTime(600,t+0.3);o.frequency.exponentialRampToValueAtTime(200,t+0.6);g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.7);o.start(t);o.stop(t+0.7);},
  slideWhistle:function(){var c=getCtx(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="sine";o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(200,t+0.5);g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.55);o.start(t);o.stop(t+0.55);},
  cowbell:function(){var c=getCtx(),t=c.currentTime;[562,845].forEach(function(f){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="square";o.frequency.value=f;g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.8);o.start(t);o.stop(t+0.8);});},
  fart:function(){var c=getCtx(),t=c.currentTime,buf=c.createBuffer(1,c.sampleRate*0.4,c.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1);var src=c.createBufferSource(),filt=c.createBiquadFilter(),g=c.createGain();filt.type="lowpass";filt.frequency.setValueAtTime(300,t);filt.frequency.exponentialRampToValueAtTime(80,t+0.4);src.buffer=buf;src.connect(filt);filt.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);src.start(t);},
  tada:function(){var c=getCtx(),t=c.currentTime;[[523,0],[659,0.1],[784,0.2],[1047,0.3]].forEach(function(p){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="triangle";o.frequency.value=p[0];var st=t+p[1];g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.25,st+0.05);g.gain.exponentialRampToValueAtTime(0.001,st+0.35);o.start(st);o.stop(st+0.35);});},
  pick:function(){var c=getCtx(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.start(t);o.stop(t+0.12);}
};
var CS=["boing","slideWhistle","cowbell","fart","boing","cowbell"];
function ncs(){sfx[CS[soundCycle++%CS.length]]();}

// ── Helpers ──────────────────────────────────────────────────────────────────
function delay(ms,fn){if(!running)return;var id=setTimeout(fn,ms);timeoutIds.push(id);}
function stopAll(){
  running=false;waitingForPick=false;doneBtnActive=false;synth.cancel();
  timeoutIds.forEach(clearTimeout);timeoutIds=[];
  if(cdId)clearTimeout(cdId);if(pcdId)clearTimeout(pcdId);
  document.getElementById("countdown-wrap").style.display="none";
  document.getElementById("pcd-wrap").style.display="none";
  document.getElementById("done-btn").style.display="none";
}
function utter(text,voice,lang,rate,vol,cb){
  if(!running){if(cb)cb();return;}
  if(typeof vol==="function"){cb=vol;vol=1;}
  var u=new SpeechSynthesisUtterance(text);
  if(voice){u.voice=voice;u.lang=voice.lang;}else{u.lang=lang||"en-US";}
  u.rate=rate||0.88;u.pitch=1;u.volume=vol||1;
  dbg("say","SAY ["+vname+"] vol="+Math.round((vol||1)*100)+"% \""+text.substr(0,80)+(text.length>80?"…":"")+"\"");
  u.onend=cb||function(){};
  u.onerror=function(e){dbg("evt","ERR("+e.error+") \""+text.substr(0,40)+"\"");if(e.error!=="interrupted"&&cb)cb();};
  synth.speak(u);
}
function bilingual(en,th,cb){
  utter(en,enVoice(),"en-US",0.88,1,function(){if(!running){if(cb)cb();return;}delay(300,function(){utter(th,thVoice,"th-TH",0.85,1,cb);});});
}
function setStatus(m,c){var e=document.getElementById("status");e.textContent=m;e.className=c||"";}
function setPI(m,c){var e=document.getElementById("phase-instr");e.textContent=m;e.className=c||"";}
function setPT(h,c){var e=document.getElementById("phase-text");e.innerHTML=h;e.className=c||"";var plain=h.replace(/<[^>]+>/g,"").trim().substr(0,80);}
function showScreen(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});document.getElementById(id).classList.add("active");}

// ── Setup screen ─────────────────────────────────────────────────────────────
var selectedKeys={};
function buildRoster(){
  var grid=document.getElementById("roster-grid");grid.innerHTML="";
  ROSTER.forEach(function(p){
    var tile=document.createElement("div");tile.className="r-tile";tile.id="rtile-"+p.key;

    tile.onclick=function(){toggleRoster(p.key);};
    grid.appendChild(tile);
  });
}
function toggleRoster(key){
  selectedKeys[key]=!selectedKeys[key];if(!selectedKeys[key])delete selectedKeys[key];
  document.getElementById("rtile-"+key).classList.toggle("sel",!!selectedKeys[key]);
  updateSelCount();
}
function updateSelCount(){
  var n=Object.keys(selectedKeys).length;
  var el=document.getElementById("sel-count"),btn=document.getElementById("go-btn");
  if(n===0){el.textContent="Tap to select players";btn.disabled=true;}
  else{el.innerHTML="<span>"+n+"</span> player"+(n===1?"":"s")+" — blanks rotate 1→2→…→"+n+"→1";btn.disabled=false;}
}
function goSetup(){stopAll();showScreen("screen-setup");}

// ── Player row ────────────────────────────────────────────────────────────────
function buildPlayerRow(){
  var row=document.getElementById("player-row");row.innerHTML="";
  activePlayers.forEach(function(p,i){
    var slot=document.createElement("div");slot.className="player-slot";slot.id="pslot-"+i;
    var ring=document.createElement("div");ring.className="player-ring";ring.style.width="50px";ring.style.height="50px";
    var img=document.createElement("img");img.src=p.img;img.alt=p.name;
    ring.appendChild(img);
    var nm=document.createElement("div");nm.className="player-name";nm.textContent=p.name;
    slot.appendChild(ring);slot.appendChild(nm);row.appendChild(slot);
  });
}
function setSlot(idx){
  for(var i=0;i<activePlayers.length;i++) document.getElementById("pslot-"+i).className="player-slot"+(i===idx?" active":"");
}
function clearSlots(){for(var i=0;i<activePlayers.length;i++) document.getElementById("pslot-"+i).className="player-slot";}

// ── Countdowns ────────────────────────────────────────────────────────────────
function startPickCd(ms,onExp){
  var w=document.getElementById("countdown-wrap"),b=document.getElementById("countdown-bar"),l=document.getElementById("countdown-label");
  w.style.display="block";b.style.width="100%";var end=Date.now()+ms;
  function tick(){if(!running||!waitingForPick){w.style.display="none";return;}var pct=Math.max(0,((end-Date.now())/ms)*100);b.style.width=pct+"%";l.textContent="Choose! ("+Math.max(0,Math.ceil((end-Date.now())/1000))+"s)";if(pct>0){cdId=setTimeout(tick,80);}else{w.style.display="none";if(waitingForPick&&onExp)onExp();}}cdId=setTimeout(tick,80);
}
function startPhaseCd(ms,lbl,cb){
  var w=document.getElementById("pcd-wrap"),b=document.getElementById("pcd-bar"),l=document.getElementById("pcd-lbl");
  w.style.display="block";b.style.width="100%";var end=Date.now()+ms;
  function tick(){if(!running){w.style.display="none";return;}var pct=Math.max(0,((end-Date.now())/ms)*100);b.style.width=pct+"%";l.textContent=(lbl?lbl+" ":"")+"("+Math.max(0,Math.ceil((end-Date.now())/1000))+"s)";if(pct>0){pcdId=setTimeout(tick,80);}else{w.style.display="none";if(cb)cb();}}pcdId=setTimeout(tick,80);
}
function onDoneBtn(){if(!doneBtnActive)return;doneBtnActive=false;document.getElementById("done-btn").style.display="none";document.getElementById("pcd-wrap").style.display="none";if(pcdId)clearTimeout(pcdId);if(doneCallback)doneCallback();}

// ── Chunk box ─────────────────────────────────────────────────────────────────
function setChunk(tense,text){
  var cb=document.getElementById("chunk-box");
  cb.className=tense==="past"?"past-col":tense==="present"?"pres-col":"fut-col";
  cb.innerHTML=text;
  var plain=text.replace(/<[^>]+>/g,"").trim().substr(0,80);
}

// ── GAME ──────────────────────────────────────────────────────────────────────
function startGame(){
  if(synth.speaking)synth.cancel();
  if(!allVoices.length)loadVoices();
  activePlayers=ROSTER.filter(function(p){return !!selectedKeys[p.key];});
  activePlayers.sort(function(a,b){return a.age-b.age;});
  buildRounds(activePlayers);
  buildPlayerRow();showScreen("screen-game");
  running=true;roundIdx=0;allPicks=[];soundCycle=0;
  document.getElementById("phase-box").style.display="none";
  document.getElementById("chunk-box").style.display="block";
  clearSlots();setStatus("");
  sfx.partyHorn();
  delay(700,function(){doRound(0);});
}

function doRound(ri){
  if(!running)return;
  dbg("evt","── doRound("+ri+") ──");
  roundIdx=ri;roundPicks=[null,null,null];roundPickLabels=["","",""];
  document.getElementById("phase-box").style.display="none";
  document.getElementById("chunk-box").style.display="block";
  document.getElementById("buttons").innerHTML="";
  setChunk(ROUNDS[ri].tense,"&nbsp;");
  setStatus("");delay(300,function(){doStep(ri,0);});
}

function doStep(ri,si){
  if(!running)return;
  var round=ROUNDS[ri];
  var globalBlank=ri*3+si;
  dbg("evt","doStep(ri="+ri+",si="+si+") globalBlank="+globalBlank+" picker="+activePlayers[globalBlank%activePlayers.length].name);
  var pickerIdx=globalBlank%activePlayers.length;
  var picker=activePlayers[pickerIdx];
  setSlot(pickerIdx);
  // Show in-progress sentence: confirmed picks so far + placeholder
  (function(){
    var parts=[];
    for(var k=0;k<si;k++) if(roundPickLabels[k]) parts.push(roundPickLabels[k]);
    var display=parts.length
      ? parts.join(", ")+", <span style='color:#aaa'>___</span>"
      : "<span style='color:#aaa'>___</span>";
    setChunk(round.tense,"<span style='font-size:10px;color:#b07000;display:block;margin-bottom:3px'>"+picker.name+", your turn ⤵</span>"+display);
  })();
  var blank=round.blanks[si];
  var cont=document.getElementById("buttons");cont.innerHTML="";
  blank.choices.forEach(function(c,ci){
    var btn=document.createElement("button");btn.className="cbtn";btn.id="cbtn-"+ci;
    var fullEN=round.choiceEN[si](c);
    // Button = full sentence chunk (icon + text + Thai gloss)
    btn.innerHTML="<span class='icon'>"+c.icon+"</span><span class='txt'><span class='en'>"+fullEN+"</span><span class='th'>"+c.th+"</span></span>";
    btn.disabled=true;
    btn.onclick=(function(choice,fullLabel){return function(){if(waitingForPick)onPick(round,si,ci,choice,btn,fullLabel);};})(c,fullEN);
    cont.appendChild(btn);
  });
  setStatus("🔊 Listen…","speaking");
  var prompt=picker.name+", your turn!";
  utter(prompt,enVoice(),"en-US",0.88,1,function(){
    if(!running)return;
    delay(200,function(){
      utter("เลือกเลย!",thVoice,"th-TH",0.85,1,function(){
        if(!running)return;
        delay(200,function(){
          setStatus("👂 Listen…","speaking");
          speakChoices(round,si,0,blank.choices,function(){
            if(!running)return;
            waitingForPick=true;setStatus("👆 Choose!","waiting");
            startPickCd(7000,function(){
              if(!running||!waitingForPick)return;
              var ri2=Math.floor(Math.random()*blank.choices.length);sfx.boing();
              var autoChoice=blank.choices[ri2];
              var autoLabel=round.choiceEN[si](autoChoice);
              delay(300,function(){onPick(round,si,ri2,autoChoice,document.getElementById("cbtn-"+ri2),autoLabel);});
            });
          });
        });
      });
    });
  });
}

function speakChoices(round,si,ci,choices,onDone){
  if(!running||ci>=choices.length){if(onDone)onDone();return;}
  var btn=document.getElementById("cbtn-"+ci),c=choices[ci];
  if(btn){btn.classList.add("lit");btn.disabled=false;}
  delay(400,function(){
    if(!running)return;
    var enText=round.choiceEN[si](c);
    var thText=round.choiceTH[si](c);
    // For the first choice only, prepend the accumulated lead-in so far
    if(ci===0 && si>0){
      var leadIn=roundPickLabels.slice(0,si).join(", ")+", ";
      enText=leadIn+enText.replace(/^…/,"");
    }
    var next=function(){if(!running)return;ncs();delay(500,function(){speakChoices(round,si,ci+1,choices,onDone);});};
    utter(enText,enVoice(),"en-US",0.85,1,function(){
      if(!running)return;
      delay(150,function(){
        utter(thText,thVoice,"th-TH",0.85,1,next);
      });
    });
  });
}

function onPick(round,si,ci,choice,btn,fullLabel){
  if(!running||!waitingForPick)return;
  waitingForPick=false;synth.cancel();
  if(cdId)clearTimeout(cdId);
  document.getElementById("countdown-wrap").style.display="none";
  document.querySelectorAll(".cbtn").forEach(function(b){b.disabled=true;});
  if(btn)btn.classList.add("chosen");
  roundPicks[si]=choice;
  // Strip leading ellipsis and trailing comma — join adds commas
  var displayLabel=(fullLabel||choice.en).replace(/^…/,"").replace(/,$/,"").trim();
  roundPickLabels[si]=displayLabel;
  sfx.pick();
  // Show all confirmed picks so far as growing sentence
  (function(){
    var parts=[];
    for(var k=0;k<=si;k++) if(roundPickLabels[k]) parts.push(roundPickLabels[k]);
    var done=si>=2;
    var joined=parts.join(", ");
    setChunk(round.tense,(done?"✓ <strong>"+joined+".</strong>":"<strong>"+joined+"</strong>"));
  })();
  setStatus("");
  if(si<2){delay(600,function(){doStep(roundIdx,si+1);});}
  else{
    allPicks[roundIdx]=roundPicks.slice();sfx.tada();
    if(roundIdx<2){delay(700,function(){doRound(roundIdx+1);});}
    else{delay(600,function(){startBackEnd();});}
  }
}

// ── BACK-END ──────────────────────────────────────────────────────────────────

  if(!running)return;
  clearSlots();
  document.getElementById("buttons").innerHTML="";
  document.getElementById("chunk-box").style.display="none";
  document.getElementById("phase-box").style.display="block";
  var ap=allPicks;
  var enPast=ROUNDS[0].en(ap[0].map(function(x){return x.en;}));
  var enPres=ROUNDS[1].en(ap[1].map(function(x){return x.en;}));
  var enFut =ROUNDS[2].en(ap[2].map(function(x){return x.en;}));
  var thPast=ROUNDS[0].th(ap[0].map(function(x){return x.th;}));
  var thPres=ROUNDS[1].th(ap[1].map(function(x){return x.th;}));
  var thFut =ROUNDS[2].th(ap[2].map(function(x){return x.th;}));
  var enStory=enPast+" "+enPres+" "+enFut;
  var thStory=thPast+" "+thPres+" "+thFut;
  var N=activePlayers.length;
  function rpn(g){return activePlayers[g%N].name;}
  var chunks=[
    ["Before MhooDeng's birthday party, Inter "+ap[0][0].en, "…while Boom "+ap[0][1].en, "…and Mickey "+ap[0][2].en],
    ["Right now, MhooDeng is "+ap[1][0].en, "…and Minnie is "+ap[1][1].en, "…while Peter is "+ap[1][2].en],
    ["After the party, MhooDeng will "+ap[2][0].en, "…while Inter will "+ap[2][1].en, "…and Minnie will "+ap[2][2].en]
  ];
  setPT(thStory,"thai");setPI("ฟังเรื่องราวในภาษาไทย...","");
  utter(thStory,thVoice,"th-TH",0.82,1,function(){
    if(!running)return;
    delay(800,function(){
      bilingual("Repeat after me.","พูดตามฉันนะ",function(){
        if(!running)return;
        delay(400,function(){
          runAllChunks(chunks,0,function(){
            if(!running)return;
            setPT(enStory,"green");setPI("อ่านจบแล้ว กด Done!","go");
            document.getElementById("done-btn").style.display="block";doneBtnActive=true;
            utter("ลองพูดทั้งเรื่องเป็นภาษาอังกฤษ",thVoice,"th-TH",0.85,1,function(){
              if(!running)return;
              doneCallback=function(){delay(300,startDrill);};

            });
          });

      });

}
function runAllChunks(all,gi,cb){if(!running||gi>=all.length){if(cb)cb();return;}runChunkGroup(all[gi],0,function(){delay(500,function(){runAllChunks(all,gi+1,cb);});});}
function runChunkGroup(grp,i,cb){
  if(!running||i>=grp.length){if(cb)cb();return;}
  setPT(grp[i],"");setPI("Repeat! 👂","repeat");
  utter(grp[i],enVoice(),"en-US",0.82,1,function(){
    if(!running){if(cb)cb();return;}
    startPhaseCd(5000,"Repeat",function(){
      if(!running){if(cb)cb();return;}
      if(i===0){utter("พูดต่อไปนะ",thVoice,"th-TH",0.85,1,function(){if(!running){if(cb)cb();return;}delay(200,function(){runChunkGroup(grp,i+1,cb);});});}
      else{delay(300,function(){runChunkGroup(grp,i+1,cb);});}
    });
  });
}

// ── Five Words in English drill ───────────────────────────────────────────────
var DRILL=[{en:"blow",th:"เป่า"},{en:"blue",th:"สีฟ้า"},{en:"blast",th:"ระเบิด"},{en:"blink",th:"กะพริบตา"},{en:"bloom",th:"บาน"}];
var drillWordIdx=0;

function startDrill(){
  running=true;
  document.getElementById("done-btn").style.display="none";
  // Hide game elements, show phase-box as drill stage
  document.getElementById("chunk-box").style.display="none";
  document.getElementById("buttons").innerHTML="";
  document.getElementById("phase-box").style.display="block";
  // Title card — styled like Cinq Mots intro
  setPT("<div style='font-size:13px;color:#888;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px'>🇬🇧 Five Words in English</div><div style='font-size:16px;font-weight:700;color:#1a3a5c'>ห้าคำภาษาอังกฤษ</div>","");
  setPI("","");
  // Build pip row in phase-instr area
  var pips="<div id='drill-pips' style='display:flex;justify-content:center;gap:8px;margin:6px 0'>";
  for(var i=0;i<DRILL.length;i++) pips+="<div id='dpip"+i+"' style='width:26px;height:4px;border-radius:2px;background:#d0c8b8;transition:all 0.3s'></div>";
  pips+="</div>";
  document.getElementById("phase-text").innerHTML="<div style='font-size:13px;color:#888;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px'>🇬🇧 Five Words in English</div><div style='font-size:16px;font-weight:700;color:#1a3a5c'>ห้าคำภาษาอังกฤษ</div>"+pips;
  // Thai intro instruction
  utter("ตอนนี้เราจะฝึกคำภาษาอังกฤษห้าคำนะ ฟังแต่ละคำและพูดตาม",thVoice,"th-TH",0.85,1,function(){
    if(!running)return;
    delay(500,function(){drillWordIdx=0;drillWord(0);});
  });
}

function drillWord(i){
  if(!running)return;
  if(i>=DRILL.length){delay(400,endLesson);return;}
  drillWordIdx=i;
  var w=DRILL[i];
  // Update pips
  for(var j=0;j<DRILL.length;j++){
    var pip=document.getElementById("dpip"+j);
    if(!pip)continue;
    pip.style.background=j<i?"#4060c0":j===i?"#e0a000":"#d0c8b8";
    pip.style.transform=j===i?"scaleY(2)":"scaleY(1)";
  }
  // Show word card
  document.getElementById("phase-text").innerHTML=
    "<div style='display:flex;justify-content:center;gap:8px;margin-bottom:8px' id='drill-pips-inner'>"
    +DRILL.map(function(_,j){return "<div style='width:26px;height:4px;border-radius:2px;background:"+(j<i?"#4060c0":j===i?"#e0a000":"#d0c8b8")+"'></div>";}).join("")
    +"</div>"
    +"<div style='font-size:11px;color:#b05000;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px'>SW · word "+(i+1)+" of "+DRILL.length+"</div>"
    +"<div style='font-size:36px;font-weight:900;color:#b05000;margin-bottom:3px'>"+w.en+"</div>"
    +"<div style='font-size:16px;color:#6a3a8c;font-weight:600'>"+w.th+"</div>";
  setPI("ฟังนะ…","");
  // Play loud+soft pairs 3 times using setInterval — no waiting for onend
  // Each cycle: loud fires, 400ms later soft fires, 400ms later next loud
  var cycle=0, maxCycles=3;
  function playLoud(){
    if(!running)return;
    setPI("ฟังนะ 🔊","");
    var u=new SpeechSynthesisUtterance(w.en);
    u.voice=enVoice()||null;u.lang="en-US";u.rate=0.6;u.volume=1.0;u.onerror=function(){};
    synth.speak(u);
  }
  function playSoft(){
    if(!running)return;
    setPI("ฟังนะ (เบาๆ) 🔉","");
    var u=new SpeechSynthesisUtterance(w.en);
    u.voice=enVoice()||null;u.lang="en-US";u.rate=0.6;u.volume=0.20;u.onerror=function(){};
    synth.speak(u);
  }
  // Schedule: t=0 loud, t=400 soft, t=800 loud, t=1200 soft, t=1600 loud, t=2000 soft, t=2400 done
  var drillTimes=[0,400,800,1200,1600,2000];
  var drillIsLoud=[true,false,true,false,true,false];
  var drillTimers=[];
  drillTimes.forEach(function(t,idx){
    var tid=setTimeout(function(){
      if(!running)return;
      if(drillIsLoud[idx])playLoud();else playSoft();
    },t);
    drillTimers.push(tid);
    timeoutIds.push(tid);
  });
  // After all plays done, Thai instruction then free practice
  var finTid=setTimeout(function(){
    if(!running)return;
    utter("ทีนี้พูดคำนี้ให้ได้มากที่สุดใน 5 วินาที เริ่ม!",thVoice,"th-TH",0.85,1,function(){
      if(!running)return;
      setPI("Say it! 🗣️","repeat");
      startRepeatPhase(w,5000,function(){
        delay(400,function(){drillWord(i+1);});
      });
    });
  },2500);
  timeoutIds.push(finTid);
}

function utterLoud(w,cb){
  setPI("ฟังนะ 🔊","");
  utter(w.en,enVoice(),"en-US",0.6,1.0,cb);
}
function utterSoft(w,cb){
  setPI("ฟังนะ (เบาๆ) 🔉","");
  utter(w.en,enVoice(),"en-US",0.6,0.20,cb);
}

function startRepeatPhase(w,ms,cb){
  // Just show the prompt and countdown — no soft voice, they say it on their own
  setPI("Say it! 🗣️","repeat");
  startPhaseCd(ms,"พูดตาม",function(){if(cb)cb();});
}

function endLesson(){
  setPT("","");setPI("","");
  var hasMalika=activePlayers.some(function(p){return p.key==="malika";});
  if(hasMalika){
    utter("เยี่ยมมาก! ตอนนี้มาถึง Cinq Mots avec Malika แล้ว!",thVoice,"th-TH",0.85,1,function(){
      running=false;
      setTimeout(function(){showScreen("screen-cinq");setTimeout(startCinq,600);},1000);
    });
  } else {
    bilingual("Fantastic! See you next time!","เยี่ยมมากเลยทุกคน เจอกันครั้งหน้านะ",function(){running=false;});
  }
}

// ── CINQ MOTS ─────────────────────────────────────────────────────────────────
function delay2(ms,fn){if(!cinqRunning)return;setTimeout(fn,ms);}
function utterCinq(text,voice,lang,rate,vol,cb){
  if(!cinqRunning){dbg("evt","utterCinq SKIP (cinqRunning=false) "+text.substr(0,30));if(cb)cb();return;}
  if(typeof vol==="function"){cb=vol;vol=1;}
  var u=new SpeechSynthesisUtterance(text);if(voice){u.voice=voice;u.lang=voice.lang;}else{u.lang=lang||"fr-FR";}
  u.rate=rate||0.85;u.pitch=1;u.volume=vol||1;
  var vname=voice?voice.name:(lang||"fr-FR");
  dbg("say","CINQ SAY ["+vname+"] vol="+Math.round((vol||1)*100)+"% \""+text.substr(0,60)+"\"");
  u.onend=cb||function(){};
  u.onerror=function(e){if(e.error!=="interrupted"&&cb)cb();};
  synth.speak(u);
}
function startCinq(){
  if(synth.speaking)synth.cancel();
  // Short pause to let synth settle after cancel
  setTimeout(function(){
    cinqRunning=true;
    document.getElementById("cinq-finale").style.display="none";
    var pr=document.getElementById("cinq-pips");pr.innerHTML="";
    CINQ.forEach(function(_,i){var p=document.createElement("div");p.className="cinq-pip";p.id="cpip"+i;pr.appendChild(p);});
    document.getElementById("cinq-fr").textContent="...";document.getElementById("cinq-th").textContent="";document.getElementById("cinq-en").textContent="";document.getElementById("cinq-num").textContent="";document.getElementById("cinq-instr").textContent="ฟัง...";
    utterCinq("ถึงตาของมาลิก้าแล้ว! ห้าคำภาษาฝรั่งเศสสำหรับคืนนี้ ฟังและพูดตาม",thVoice,"th-TH",0.85,1,function(){if(!cinqRunning)return;delay2(600,function(){doCinq(0);});});
  },800);
}
function doCinq(idx){
  if(!cinqRunning)return;if(idx>=CINQ.length){endCinq();return;}
  var w=CINQ[idx];currentCinqWord=w.fr;
  CINQ.forEach(function(_,i){var p=document.getElementById("cpip"+i);if(p)p.className="cinq-pip"+(i<idx?" done":i===idx?" active":"");});
  document.getElementById("cinq-num").textContent="คำที่ "+(idx+1)+" / "+CINQ.length;
  document.getElementById("cinq-fr").textContent=w.fr;document.getElementById("cinq-th").textContent=w.th;document.getElementById("cinq-en").textContent="("+w.en+")";
  setCDot(-1);document.getElementById("cinq-instr").textContent="ฟัง...";document.getElementById("cinq-instr").className="";
  utterCinq("ฟังฉันพูดคำนี้สามครั้งนะ",thVoice,"th-TH",0.85,1,function(){
    if(!cinqRunning)return;delay2(300,function(){spCinq(w,0,function(){delay2(300,function(){
      utterCinq("ทีนี้ลองพูดตามสามครั้ง",thVoice,"th-TH",0.85,1,function(){
        if(!cinqRunning)return;repCinq(0,function(){delay2(200,function(){
          utterCinq("Très bien !",frVoice,"fr-FR",0.88,1,function(){var p=document.getElementById("cpip"+idx);if(p)p.className="cinq-pip done";delay2(400,function(){doCinq(idx+1);});});
        });});
      });
    });});});
  });
}
function setCDot(a){for(var i=0;i<3;i++){var d=document.getElementById("cd"+i);if(d)d.className="cinq-dot"+(i<a?" done":i===a?" active":"");}}
function spCinq(w,n,cb){if(!cinqRunning||n>=3){if(cb)cb();return;}setCDot(n);document.getElementById("cinq-instr").textContent="ฟัง ("+(n+1)+"/3)...";utterCinq(w.fr,frVoice,"fr-FR",0.65,1,function(){if(!cinqRunning){if(cb)cb();return;}delay2(1500,function(){spCinq(w,n+1,cb);});});}
function repCinq(n,cb){
  if(!cinqRunning||n>=3){if(cb)cb();return;}setCDot(n);
  document.getElementById("cinq-instr").textContent="พูดตาม! ("+(n+1)+"/3)";document.getElementById("cinq-instr").className="your-turn";
  var u=new SpeechSynthesisUtterance(currentCinqWord);u.voice=frVoice||null;u.lang="fr-FR";u.rate=0.65;u.volume=0.12;
  u.onend=function(){
    if(!cinqRunning){if(cb)cb();return;}
    var wrap=document.getElementById("cinq-cd-wrap"),bar=document.getElementById("cinq-cd-bar");
    wrap.style.display="block";bar.style.width="100%";var end=Date.now()+1500;
    function tick(){if(!cinqRunning){wrap.style.display="none";return;}var pct=Math.max(0,((end-Date.now())/1500)*100);bar.style.width=pct+"%";if(pct>0){cinqCdId=setTimeout(tick,80);}else{wrap.style.display="none";repCinq(n+1,cb);}}cinqCdId=setTimeout(tick,80);
  };u.onerror=function(){repCinq(n+1,cb);};synth.speak(u);
}
function endCinq(){
  cinqRunning=false;
  document.getElementById("cinq-finale").style.display="block";
  utterCinq("Bravo !",frVoice,"fr-FR",0.88,1,function(){
    cinqRunning=true;
    setTimeout(function(){
      // Bonus sentence: teach and say "Je t'aime, Boom!"
      document.getElementById("cinq-fr").textContent="Joyeux anniversaire, MhooDeng !";
      document.getElementById("cinq-th").textContent="สุขสันต์วันเกิด หมูเด้ง!";
      document.getElementById("cinq-en").textContent="(Happy birthday, MhooDeng!)";
      document.getElementById("cinq-num").textContent="BONUS SENTENCE";
      document.getElementById("cinq-instr").textContent="ฟังและพูดตามนะ";
      utterCinq("เอาละ ประโยคพิเศษ! พูดตามฉันด้วยนะ",thVoice,"th-TH",0.85,1,function(){
        cinqRunning=true;
        utterCinq("Joyeux anniversaire, MhooDeng !",thVoice,"th-TH",0.72,1,function(){
          cinqRunning=true;
          setTimeout(function(){
            utterCinq("Joyeux anniversaire, MhooDeng !",thVoice,"th-TH",0.72,0.12,function(){
              // whisper model — student repeats
            });
          },500);
        });
      });
    },1000);
  });
}
